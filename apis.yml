apis:
- aid: greenhelix-net:a2a-commerce-gateway-api
  name: A2A Commerce Gateway API
  description: 'REST API for agent-to-agent commerce: billing and wallets, payment intents and escrow, subscriptions,
    identity and reputation, marketplace, trust scoring, messaging and negotiation, disputes, webhooks, event bus,
    API keys and database operations. 114 paths / 132 operations under /v1 with a global choice of Bearer API key,
    X-API-Key or x402 X-PAYMENT security. The former POST /v1/execute tool dispatcher is 410 Gone (sunset 2026-10-01);
    POST /v1/batch remains for multi-tool dispatch and is how the MCP server invokes tools.'
