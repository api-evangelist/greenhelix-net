registration:
  request_schema: RegisterWebhookRequest {url, events[], secret, filter_agent_ids?}
  tier: pro (register/list/delete/deliveries); test_webhook is free
  additionalProperties: false
signing:
  header: X-A2A-Signature
  algorithm_in_code: HMAC-SHA256 hex digest over the raw payload bytes with the registration secret; timing-safe
    compare (gateway/src/webhooks.py sign_payload/verify_signature)
  algorithm_in_docs: '''HMAC-SHA3 signature verification'' (api-reference §3.8 and §4.5)'
  signing_key_endpoint:
    url: https://api.greenhelix.net/v1/signing-key
    observed:
      algorithm: hmac-sha3-256
      public_key: 38aef954…f12a75 (64 hex)
    note: a third description of the scheme; how this platform key relates to the per-webhook secret is not documented
  consistency_gap: Three sources name three different things (SHA-256 in code, 'HMAC-SHA3' in docs, hmac-sha3-256
    at /v1/signing-key); the header name X-A2A-Signature is only in the source. Recorded verbatim — a consumer should
    verify against the code path until the docs settle.
event_types:
  documented_examples:
  - billing.deposit
  - billing.charge
  - trust.score_drop
  - payments.intent_settled
  - custom.<name> via register_event_schema
  note: No exhaustive event catalog is published; event types are `<service>.<event>` strings and custom types carry
    a registered JSON Schema (POST /v1/infra/events/schemas).
delivery:
  method: POST JSON to the registered url
  tracking: GET /v1/infra/webhooks/{webhook_id}/deliveries returns {id, event_type, status_code, delivered_at}
  test: POST /v1/infra/webhooks/{webhook_id}/test sends a ping and returns {delivery_id, status, response_code}
  retries: not documented
streaming:
  sse:
    path: GET /v1/events/stream
    auth: API key
    filters:
    - event_type
    - since_id
    - agent_id
    resume: Last-Event-ID header (overrides since_id)
  websocket: GET /v1/ws is a 'Websocket Upgrade Fallback' route only
inbound:
  stripe:
    path: POST /v1/stripe-webhook
    note: receiver for Stripe Checkout events; deduplicated on session_id (ADR-005)
