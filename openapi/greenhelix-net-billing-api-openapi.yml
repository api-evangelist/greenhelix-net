  /v1/billing/keys:
    post:
      tags:
      - Billing
      summary: Create Billing Api Key
      operationId: create_billing_api_key_v1_billing_keys_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBillingApiKeyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Billing
      summary: List Billing Api Keys
      description: 'List API keys owned by the authenticated caller.


        v1.2.4 audit P0-1: this is the non-admin self-service path.

        ``create_api_key`` is reused as the ``require_tool`` anchor

        (it is NOT in ``ADMIN_ONLY_TOOLS``) so free/pro tiers reach

        this handler without hitting the admin gate. The handler then

        calls the ``_list_api_keys`` implementation directly, always

        scoped to the authenticated caller''s ``agent_id`` via ownership.'
      operationId: list_billing_api_keys_v1_billing_keys_get
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/billing/wallets/{agent_id}/convert:
    post:
      tags:
      - Billing
      summary: Convert Currency
      operationId: convert_currency_v1_billing_wallets__agent_id__convert_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertCurrencyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ConvertCurrencyRequest:
      properties:
        amount:
          anyOf:
          - type: number
            maximum: 1000000000.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,8}0*$
          title: Amount
        from_currency:
          type: string
          title: From Currency
        to_currency:
          type: string
          title: To Currency
      additionalProperties: false
      type: object
      required:
      - amount
      - from_currency
      - to_currency
      title: ConvertCurrencyRequest
      example:
        amount: '100.00'
        from_currency: CREDITS
        to_currency: USD
    CreateBillingApiKeyRequest:
      properties:
        tier:
          type: string
          title: Tier
          default: free
      additionalProperties: false
      type: object
      title: CreateBillingApiKeyRequest
      description: 'Self-service API key creation — v1.2.4 audit P0-1 successor

        of the former ``POST /v1/infra/keys``.'
      example:
        tier: free
    CreateWalletRequest:
      properties:
        agent_id:
          type: string
          maxLength: 128
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$
          title: Agent Id
        initial_balance:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Initial Balance
          default: '0'
        signup_bonus:
          type: boolean
          title: Signup Bonus
          default: true
      additionalProperties: false
      type: object
      required:
      - agent_id
      title: CreateWalletRequest
      example:
        agent_id: agent-alice
        initial_balance: '100.00'
        signup_bonus: true
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DepositRequest:
      properties:
        amount:
          anyOf:
          - type: number
            maximum: 1000000000.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,8}0*$
          title: Amount
        currency:
          type: string
          title: Currency
          default: CREDITS
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - amount
      title: DepositRequest
      example:
        amount: '50.00'
        currency: CREDITS
        description: Top-up via Stripe
    BudgetCapRequest:
      properties:
        daily:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Daily
        monthly:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Monthly
        alert_threshold:
          type: number
          title: Alert Threshold
          default: 0.8
      additionalProperties: false
      type: object
      title: BudgetCapRequest
      example:
        alert_threshold: 0.8
        daily_cap: '100.00'
        monthly_cap: '2000.00'
    WithdrawRequest:
      properties:
        amount:
          anyOf:
          - type: number
            maximum: 1000000000.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,8}0*$
          title: Amount
        currency:
          type: string
          title: Currency
          default: CREDITS
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - amount
      title: WithdrawRequest
      example:
        amount: '25.00'
        currency: CREDITS
        description: Payout to external wallet
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key passed as Bearer token in the Authorization header.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key passed directly in the X-API-Key header (alternative to Bearer).
    X402Payment:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment proof for stateless authentication.
