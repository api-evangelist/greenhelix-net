        in: query
        required: true
        schema:
          type: string
          title: Agent Id
      - name: tool_name
        in: query
        required: true
        schema:
          type: string
          title: Tool Name
      - name: quantity
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Quantity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
