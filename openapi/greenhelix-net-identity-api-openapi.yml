openapi: 3.2.0
info:
  title: A2A Commerce Gateway Identity API
  version: 1.4.10
  description: 'A2A Commerce Gateway — agent-to-agent commerce infrastructure operated by Green Helix Consulting, LLC: billing and wallets, payment intents and escrow, subscriptions, Ed25519 agent identity and reputation, service marketplace, trust scoring, encrypted messaging and price negotiation, disputes, webhooks and an event bus.'
  contact:
    name: Green Helix
    url: https://greenhelix.net
    email: support@greenhelix.net
servers:
- url: https://api.greenhelix.net
  description: Production (the host that serves this document at /v1/openapi.json; named by the agent card url, ai-plugin.json api.url, AGENTS.md and both SDK READMEs)
- url: https://sandbox.greenhelix.net
  description: 'Sandbox — identical surface, databases reset on every deploy (docs.html; probed 2026-09-19: /v1/health 200, same 1.4.10 build)'
security:
- BearerAuth: []
- ApiKeyAuth: []
- X402Payment: []
tags:
- name: Identity
paths:
  /v1/identity/agents:
    post:
      tags:
      - Identity
      summary: Register Agent
      operationId: register_agent_v1_identity_agents_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Identity
      summary: Search Agents By Metrics
      operationId: search_agents_by_metrics_v1_identity_agents_get
      parameters:
      - name: metric_name
        in: query
        required: true
        schema:
          type: string
          title: Metric Name
      - name: min_value
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Value
      - name: max_value
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Value
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/agents/{agent_id}:
    get:
      tags:
      - Identity
      summary: Get Agent Identity
      operationId: get_agent_identity_v1_identity_agents__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/agents/{agent_id}/verify:
    post:
      tags:
      - Identity
      summary: Verify Agent
      operationId: verify_agent_v1_identity_agents__agent_id__verify_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAgentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/agents/{agent_id}/reputation:
    get:
      tags:
      - Identity
      summary: Get Agent Reputation
      operationId: get_agent_reputation_v1_identity_agents__agent_id__reputation_get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/agents/{agent_id}/claims:
    get:
      tags:
      - Identity
      summary: Get Verified Claims
      operationId: get_verified_claims_v1_identity_agents__agent_id__claims_get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/agents/{agent_id}/metrics:
    post:
      tags:
      - Identity
      summary: Submit Metrics
      operationId: submit_metrics_v1_identity_agents__agent_id__metrics_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMetricsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
