format: rfc9457
envelope:
  schema: ErrorResponse
  media_type: application/problem+json
  fields:
  - name: type
    description: Absolute URI under https://api.greenhelix.net/errors/<code>
  - name: title
  - name: status
  - name: detail
  - name: instance
    description: request path (ADR-004 says it includes ?request_id=; observed bodies carry the bare path and the
      id is in the X-Request-ID header)
  - name: code
    description: stable snake_case identifier SDKs match on (ADR-004; not present in the observed 401/404/410 bodies,
      which carry only the five RFC fields)
  example_observed:
    type: https://api.greenhelix.net/errors/missing-key
    title: Unauthorized
    status: 401
    detail: Missing API key
    instance: /v1/billing/wallets/example-agent/balance
consistency_gap: >-
  Three shapes are documented for the same errors: (1) the RFC 9457 body actually served (observed on every non-2xx),
  (2) the legacy `{success:false, error:{code,message}, request_id}` envelope the api-reference §5 still shows for
  the removed /v1/execute dispatcher, and (3) FastAPI's HTTPValidationError on 422. Live type URIs use hyphens (missing-key,
  endpoint-removed) while the documented codes use underscores (missing_key); the type URIs do not dereference (the
  /errors/ path 404s). The contract declares only 200 and 422 responses, so none of the 401/402/403/404/409/410/429
  problem types below appear in the OpenAPI.
