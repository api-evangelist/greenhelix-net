specification: API Commons Plans
specificationVersion: '0.1'
provider: Green Helix
providerId: greenhelix-net
generated: '2026-09-19'
method: probed
source: https://api.greenhelix.net/v1/pricing/tiers
sources:
- https://api.greenhelix.net/v1/pricing/tiers
- https://api.greenhelix.net/v1/pricing (137 per-tool prices)
- https://www.greenhelix.net/docs.html#upgrading
- https://github.com/mirni/a2a/blob/main/docs/api-reference.md#subscription-plans
description: >-
  Green Helix publishes its plans as a machine-readable endpoint: GET /v1/pricing/tiers returns four tiers with
  price_cents, credits_included, billing_period, rate_limit_per_hour, burst_allowance, audit_log_retention_days
  and support_level, and GET /v1/pricing returns per-call prices for all 137 tools (101 free, 30 at 0.005-0.01 credits,
  a handful at 0.1-5.0). Credits are purchased via Stripe Checkout at POST /v1/checkout; 100 credits = $1 USD, minimum
  purchase 100 credits, maximum 1,000,000 per transaction, 500-credit signup bonus (api-reference Appendix). The
  enterprise tier's catalog price is $5,000/yr; the api-reference says '$5,000-$50,000/yr … custom'. A 2% gateway
  fee applies to payment intents and 1.5% (min 0.01, max 10.0 credits) to escrow (api-reference).
plan_count: 4
credit_system:
  exchange_rate: 100 credits per $1 USD
  minimum_purchase: 100 credits ($1.00)
  maximum_per_transaction: 1,000,000 credits ($10,000)
  signup_bonus: 500 credits ($5.00)
  purchase: POST /v1/checkout (Stripe Checkout session)
