aid: greenhelix-net
name: Green Helix
description: 'Green Helix Consulting, LLC builds infrastructure for autonomous AI-agent commerce. Its A2A Commerce
  Gateway (api.greenhelix.net, v1.4.10) is a single REST API of 137 tools across 16 services: per-agent wallets
  and metered billing, authorize-then-capture payment intents, standard and performance-gated escrow, subscriptions
  and split payments, Ed25519 cryptographic agent identity with verifiable claims and reputation, a service marketplace
  with matching and ratings, composite trust scoring and SLA checks, end-to-end encrypted agent messaging with price
  negotiation, dispute resolution, HMAC-signed webhooks and an event bus, plus Stripe, GitHub and PostgreSQL connectors.
  It publishes an OpenAPI 3.1 contract, a machine-readable tool and tier catalog, an A2A agent card, an ai-plugin.json,
  Python and TypeScript SDKs, a local MCP server, and a sandbox that resets on every deploy. Errors are RFC 9457,
  rate limits are signaled in headers, and x402 payment proofs are accepted as an alternative to API keys.'
