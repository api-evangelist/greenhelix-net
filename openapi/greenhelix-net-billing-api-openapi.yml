  /v1/billing/wallets/{agent_id}/unfreeze:
    post:
      tags:
      - Billing
      summary: Unfreeze Wallet
      operationId: unfreeze_wallet_v1_billing_wallets__agent_id__unfreeze_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/billing/wallets/{agent_id}/transactions:
    get:
      tags:
      - Billing
      summary: Get Transactions
      operationId: get_transactions_v1_billing_wallets__agent_id__transactions_get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
