  /v1/identity/metrics/averages:
    get:
      tags:
      - Identity
      summary: Get Metric Averages
      operationId: get_metric_averages_v1_identity_metrics_averages_get
      parameters:
      - name: agent_id
        in: query
        required: true
        schema:
          type: string
          title: Agent Id
      - name: period
        in: query
        required: false
        schema:
          type: string
          default: 30d
          title: Period
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    SubmitMetricsRequest:
      properties:
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
        data_source:
          type: string
          title: Data Source
          default: self_reported
      additionalProperties: false
      type: object
      required:
      - metrics
      title: SubmitMetricsRequest
      example:
        data_source: self_reported
        metrics:
          avg_response_ms: 245
          error_rate: 0.01
          uptime: 0.999
    VerifyAgentRequest:
      properties:
        message:
          type: string
          title: Message
        signature:
          type: string
          title: Signature
      additionalProperties: false
      type: object
      required:
      - message
      - signature
      title: VerifyAgentRequest
      example:
        message: challenge-nonce-12345
        signature: sig_hex_string...
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RegisterAgentRequest:
      properties:
        agent_id:
          type: string
          maxLength: 128
          title: Agent Id
        public_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Key
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        capabilities:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Capabilities
      additionalProperties: false
      type: object
      required:
      - agent_id
      title: RegisterAgentRequest
      example:
        agent_id: agent-alice
        name: Alice Agent
        public_key: ed25519:abc123...
    IngestMetricsRequest:
      properties:
        agent_id:
          type: string
          maxLength: 128
          title: Agent Id
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
        data_source:
          type: string
          title: Data Source
          default: self_reported
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
        nonce:
          anyOf:
          - type: string
          - type: 'null'
          title: Nonce
      additionalProperties: false
      type: object
      required:
      - agent_id
      - metrics
      title: IngestMetricsRequest
      example:
        agent_id: agent-alice
        data_source: self_reported
        metrics:
          requests_served: 15420
          uptime: 0.999
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AddMemberRequest:
      properties:
        agent_id:
          type: string
          maxLength: 128
          title: Agent Id
        role:
          type: string
          title: Role
          default: member
      additionalProperties: false
      type: object
      required:
      - agent_id
      title: AddMemberRequest
      example:
        agent_id: agent-bob
        role: member
    CreateOrgRequest:
      properties:
        org_name:
          type: string
          title: Org Name
        agent_id:
          type: string
          title: Agent Id
          default: ''
      additionalProperties: false
      type: object
      required:
      - org_name
      title: CreateOrgRequest
      example:
        agent_id: agent-alice
        org_name: Acme AI Agents
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key passed as Bearer token in the Authorization header.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key passed directly in the X-API-Key header (alternative to Bearer).
    X402Payment:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment proof for stateless authentication.
