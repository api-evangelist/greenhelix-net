  /v1/billing/exchange-rates:
    get:
      tags:
      - Billing
      summary: Get Exchange Rate
      operationId: get_exchange_rate_v1_billing_exchange_rates_get
      parameters:
      - name: from_currency
        in: query
        required: true
        schema:
          type: string
          title: From Currency
      - name: to_currency
        in: query
        required: true
        schema:
          type: string
          title: To Currency
      responses:
        '200':
          description: Successful Response
          content:
