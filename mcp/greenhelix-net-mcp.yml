generated: '2026-09-19'
method: searched
status: published
source: https://www.npmjs.com/package/@greenhelix/mcp-server (README) + https://github.com/mirni/a2a/blob/main/sdk-ts/mcp-server/server.json
  + live GET https://api.greenhelix.net/v1/pricing on 2026-09-19
description: >-
  Green Helix ships a first-party LOCAL (stdio) MCP server, @greenhelix/mcp-server 0.1.0 on npm, that exposes the
  A2A Commerce Gateway's tool catalog to Claude Desktop, Cursor, Claude Code, Windsurf and Zed. There is NO hosted/remote
  MCP endpoint: POST tools/list to https://api.greenhelix.net/mcp, /v1/mcp and /sse all return RFC 9457 404s and
  mcp.greenhelix.net does not resolve. The server discovers tools at runtime from GET /v1/pricing (anonymous) and
  invokes them through POST /v1/batch with the A2A_API_KEY. The provider's MCP-registry manifest names the server
  net.greenhelix/mcp-server, but the official registry (registry.modelcontextprotocol.io) returns zero results for
  it, so it is not published there. The README says 141 tools; the live catalog serves 137.
deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y @greenhelix/mcp-server
  package: https://www.npmjs.com/package/@greenhelix/mcp-server
  auth: api-key
  auth_detail: env A2A_API_KEY (required; a2a_{tier}_{24hex}, free tier self-issued via POST /v1/register); env
    A2A_BASE_URL optional (default https://api.greenhelix.net)
  verified: searched
  remote_probes:
  - url: https://api.greenhelix.net/mcp
    method: POST tools/list
    http_status: 404
  - url: https://api.greenhelix.net/v1/mcp
    method: POST tools/list
    http_status: 404
  - url: https://api.greenhelix.net/sse
    method: POST tools/list
    http_status: 404
  - url: https://mcp.greenhelix.net/mcp
    method: POST tools/list
    http_status: NXDOMAIN
  checked: '2026-09-19'
local:
  name: '@greenhelix/mcp-server'
  transport: stdio
  version: 0.1.0
  published: '2026-04-13'
  install: npx -y @greenhelix/mcp-server
  bin: a2a-mcp-server
  source: https://github.com/mirni/a2a/tree/main/sdk-ts/mcp-server
  registry_manifest: sdk-ts/mcp-server/server.json (name net.greenhelix/mcp-server, schema 2025-12-11)
  official_registry: not found — https://registry.modelcontextprotocol.io/v0/servers?search=net.greenhelix returns
    count 0
  client_config:
    mcpServers:
      a2a:
        command: npx
        args:
        - -y
        - '@greenhelix/mcp-server'
        env:
          A2A_API_KEY: a2a_free_...
  how_it_works: Tool discovery via GET /v1/pricing; each MCP tools/call becomes a single-item POST /v1/batch; pricing
    and tier metadata are folded into each tool description.
tool_catalog:
  file: mcp/greenhelix-net-tool-catalog.json
  url: https://api.greenhelix.net/v1/pricing
  fetched: '2026-09-19'
