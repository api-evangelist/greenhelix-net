- id: ed25519-identity
  name: Ed25519 signed agent identity (provider-specific, not an industry standard)
  conforms: true
  evidence: POST /v1/identity/agents returns an Ed25519 keypair; VerifyAgentRequest {message, signature}; IngestMetricsRequest
    accepts signature + nonce; GET /v1/gatekeeper/proofs/{proof_id} and POST /v1/gatekeeper/proofs/verify.
  caveat: Recorded for completeness only — not a cross-provider standard and awarded no domain-standard credit.
