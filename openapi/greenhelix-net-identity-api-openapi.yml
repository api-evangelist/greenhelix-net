              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/orgs/{org_id}/members:
    post:
      tags:
      - Identity
      summary: Add Agent To Org
      operationId: add_agent_to_org_v1_identity_orgs__org_id__members_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/orgs/{org_id}/members/{agent_id}:
    delete:
      tags:
      - Identity
      summary: Remove Agent From Org
      operationId: remove_agent_from_org_v1_identity_orgs__org_id__members__agent_id__delete
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/metrics/ingest:
    post:
      tags:
      - Identity
      summary: Ingest Metrics
      operationId: ingest_metrics_v1_identity_metrics_ingest_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestMetricsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/metrics:
    get:
      tags:
      - Identity
      summary: Query Metrics
      operationId: query_metrics_v1_identity_metrics_get
      parameters:
      - name: agent_id
        in: query
        required: true
        schema:
          type: string
          title: Agent Id
      - name: metric_name
        in: query
        required: true
        schema:
          type: string
          title: Metric Name
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Since
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/identity/metrics/deltas:
    get:
      tags:
      - Identity
      summary: Get Metric Deltas
      operationId: get_metric_deltas_v1_identity_metrics_deltas_get
      parameters:
      - name: agent_id
        in: query
        required: true
        schema:
          type: string
          title: Agent Id
      - name: metric_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
