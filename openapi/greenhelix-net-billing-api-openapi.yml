          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/billing/estimate:
    get:
      tags:
      - Billing
      summary: Estimate Cost
      operationId: estimate_cost_v1_billing_estimate_get
      parameters:
      - name: tool_name
        in: query
