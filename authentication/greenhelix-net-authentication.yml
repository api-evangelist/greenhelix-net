api_key:
  format: 'a2a_{tier}_{24_hex_chars}  (tiers: free, starter, pro, enterprise; e.g. a2a_free_… )'
  issuance: 'Self-service: POST /v1/register {"agent_id"} (no auth) creates a wallet, a free-tier key and an identity
    in one step; POST /v1/billing/keys (create_billing_api_key) issues further keys; POST /v1/infra/keys is the
    deprecated older route.'
  storage: Plaintext returned exactly once at creation; stored server-side as a SHA-3-256 hash (api-reference) /
    SHA-256 (ADR-009).
  rotation: POST /v1/infra/keys/rotate {current_key} with optional X-Rotate-Confirmation header (revoke old, issue
    new at the same tier); POST /v1/infra/keys/revoke.
  header_precedence:
  - 'Authorization: Bearer <key> (preferred)'
  - 'X-API-Key: <key>'
  scoping: Tier-scoped (free 100/h … enterprise 100000/h); a key can act only for its own agent_id — 403 forbidden
    when creating keys for another agent.
x402:
  header: X-PAYMENT
  encoding: base64-encoded JSON payment proof
  when: when no API key is provided and x402 payment verification is enabled on the gateway
  settlement: on-chain USDC micropayments
  errors:
    402 payment_required: no key and x402 enabled
    402 payment_verification_failed: proof invalid
    402 payment_replay_detected: nonce already used
  note: Declared as securitySchemes.X402Payment and applied globally; not exercised live in this pass (unauthenticated
    calls answered 401 missing-key, no 402 challenge observed).
